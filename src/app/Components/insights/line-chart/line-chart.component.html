<div class="container">
  <div class="user-info-section p-4 mb-4">
    <fieldset>
      <legend class="text-left mb-4">User Info</legend>
      <hr />

      <div class="row">
        <div class="col-12 col-md-4 mb-4">
          <mat-card
            class="example-card text-center shadow rounded-3"
            appearance="outlined"
          >
            <mat-card-header class="d-flex justify-content-center">
              <mat-card-title class="text-primary text-center"
                >${{ totalIncome }}</mat-card-title
              >
            </mat-card-header>
            <mat-card-content>
              <p class="text-center">Income</p>
            </mat-card-content>
          </mat-card>
        </div>

        <div class="col-12 col-md-4 mb-4">
          <mat-card
            class="example-card text-center shadow rounded-3"
            appearance="outlined"
          >
            <mat-card-header class="d-flex justify-content-center">
              <mat-card-title class="text-danger text-center"
                >${{ totalExpense }}</mat-card-title
              >
            </mat-card-header>
            <mat-card-content>
              <p class="text-center">Expense</p>
            </mat-card-content>
          </mat-card>
        </div>

        <div class="col-12 col-md-4 mb-4">
          <mat-card
            class="example-card text-center shadow rounded-3"
            appearance="outlined"
          >
            <mat-card-header class="d-flex justify-content-center">
              <mat-card-title class="text-success text-center"
                >${{ balance }}</mat-card-title
              >
            </mat-card-header>
            <mat-card-content>
              <p class="text-center">Balance</p>
            </mat-card-content>
          </mat-card>
        </div>
      </div>
    </fieldset>
  </div>
</div>
