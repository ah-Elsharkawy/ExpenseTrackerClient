<p-dialog header="Set Budget" [modal]="true" [(visible)]="visible" [style]="{ width: '30rem' }" (onHide)="onClose()">
  <span class="p-text-secondary block mb-5">Update your budget information.</span>
  <form #SetBudget="ngForm" (ngSubmit)="onSubmit(SetBudget)">

    <div class="flex align-items-center gap-3 mb-3">
      <label for="amount" class="font-semibold w-6rem">Amount</label>
      <p-inputNumber id="amount" [(ngModel)]="usercategory.amount" [min]="1" required placeholder="Enter Amount"
        name="Amount" class="flex-auto"></p-inputNumber>
    </div>

    <div class="flex align-items-center gap-3 mb-3" *ngIf="mode == 'Add'">
      <label for="category" class="font-semibold w-6rem">Category</label>
      <p-dropdown id="category" [options]="Categories" [(ngModel)]="usercategory.categoryId" optionValue="code"
        optionLabel="name" required placeholder="Select Category" name="CategoryId" class="flex-auto"></p-dropdown>
    </div>

    <div class="flex align-items-center gap-3 mb-3" *ngIf="mode == 'Add'">
      <label for="limitType" class="font-semibold w-6rem">Limit Type</label>
      <p-dropdown id="limitType" [options]="limitTypes" optionLabel="name" optionValue="code"
        [(ngModel)]="usercategory.limitType" placeholder="Select Limit Type" required name="LimitType"
        class="flex-auto"></p-dropdown>
    </div>

    <div class="flex justify-content-end gap-2">
      <p-button label="Cancel" severity="secondary" (click)="onClose()"></p-button>
      <p-button label="Save" type="submit" [disabled]="!validateForm()"></p-button>
    </div>
  </form>
</p-dialog>
